      <line x1="28" y1="192" x2="228" y2="192" stroke="#27272a"/>
      <text x="28" y="210" font-size="8.5" fill="#71717a">Knotenzeit</text>
      <text x="200" y="210" font-size="10" font-weight="600" fill="#fafafa" text-anchor="end" font-family="ui-monospace, monospace">00:28,3</text>
      <circle cx="218" cy="206.5" r="2.5" fill="#f97316"/>

      <!-- START: single confident accent (the ONE accent), flat -->
      <rect x="14" y="234" width="138" height="56" rx="12" fill="#f97316"/>
      <text x="83" y="268" font-size="17" font-weight="700" letter-spacing="0.5" fill="#1a0f04" text-anchor="middle">START</text>
      <!-- secondary: ghost buttons, just borders -->
      <rect x="158" y="234" width="84" height="26" rx="9" fill="none" stroke="#3f3f46" stroke-width="1"/>
      <text x="200" y="250.5" font-size="9.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">Reset</text>
      <rect x="158" y="264" width="84" height="26" rx="9" fill="none" stroke="#3f3f46" stroke-width="1"/>
      <text x="200" y="280.5" font-size="9.5" font-weight="600" fill="#a1a1aa" text-anchor="middle">Speichern</text>

      <!-- Zwischenzeiten card -->
      <rect x="14" y="302" width="228" height="112" rx="14" fill="#101012" stroke="#27272a" stroke-width="1"/>
      <text x="28" y="324" font-size="11" font-weight="600" fill="#fafafa">Zwischenzeiten</text>
      <rect x="22" y="332" width="100" height="40" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="72" y="356" font-size="9.5" font-weight="500" fill="#e4e4e7" text-anchor="middle">zu Wasser</text>
      <rect x="134" y="332" width="100" height="40" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="184" y="356" font-size="9.5" font-weight="500" fill="#e4e4e7" text-anchor="middle">Knoten Start</text>
      <line x1="22" y1="384" x2="234" y2="384" stroke="#27272a"/>
      <text x="28" y="401" font-size="9.5" font-weight="500" fill="#a1a1aa">zu Wasser</text>
      <text x="222" y="401" font-size="10" font-weight="600" fill="#fafafa" text-anchor="end" font-family="ui-monospace, monospace">01:12,4</text>

      <!-- Notizen -->
      <rect x="14" y="426" width="228" height="38" rx="14" fill="#101012" stroke="#27272a" stroke-width="1"/>
      <text x="28" y="449" font-size="10.5" font-weight="600" fill="#71717a">Notizen zum Lauf …</text>

      <!-- bottom nav: flat, hairline -->
      <rect x="0" y="470" width="256" height="64" fill="#09090b"/>
      <line x1="0" y1="470" x2="256" y2="470" stroke="#27272a"/>
      <rect x="83" y="473" width="26" height="2.5" rx="1.5" fill="#f97316"/>

      <g transform="translate(22.6,484) scale(0.74)" stroke="#71717a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87m-4-12a4 4 0 0 1 0 7.75"/>
      </g>
      <text x="32" y="513" font-size="7" font-weight="600" fill="#71717a" text-anchor="middle">Aufstellung</text>
      <g transform="translate(86.6,484) scale(0.74)" stroke="#f97316" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>
      </g>
      <text x="96" y="513" font-size="7" font-weight="700" fill="#fafafa" text-anchor="middle">Stoppuhr</text>
      <g transform="translate(150.6,484) scale(0.74)" stroke="#71717a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/>
      </g>
      <text x="160" y="513" font-size="7" font-weight="600" fill="#71717a" text-anchor="middle">Analyse</text>
      <g transform="translate(214.6,484) scale(0.74)" stroke="#71717a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </g>
      <text x="224" y="513" font-size="7" font-weight="600" fill="#71717a" text-anchor="middle">Wissen</text>
    </g>
  </g>
</svg>
