<svg width="300" height="640" viewBox="0 0 300 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <clipPath id="screenA"><rect x="0" y="0" width="256" height="534" rx="44"/></clipPath>
  </defs>

  <!-- Label -->
  <text x="150" y="20" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">A · Minimal Mono</text>
  <text x="150" y="36" font-size="9" fill="#64748b" text-anchor="middle">flach · neutral · feine Borders · ein dezenter Akzent</text>

  <g transform="translate(22,50)">
    <rect x="0" y="0" width="256" height="534" rx="44" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <g clip-path="url(#screenA)">
      <!-- flat neutral background, NO gradient, NO glow -->
      <rect x="0" y="0" width="256" height="534" fill="#09090b"/>

      <!-- OS status -->
      <rect x="87" y="-2" width="82" height="24" rx="12" fill="#000000"/>
      <text x="18" y="23" font-size="11" font-weight="700" fill="#fafafa" fill-opacity="0.85">9:41</text>
      <rect x="226" y="11" width="16" height="9" rx="2" stroke="#fafafa" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="227.5" y="12.5" width="11" height="6" rx="1" fill="#fafafa" fill-opacity="0.75"/>

      <!-- sync dot + gear -->
      <circle cx="207" cy="52" r="3" fill="#22c55e"/>
      <g transform="translate(224.5,45.5) scale(0.55)" stroke="#71717a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </g>

      <!-- title: tighter, single weight hierarchy -->
      <text x="16" y="92" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Stoppuhr</text>
      <!-- segmented: subtle track, hairline -->
      <rect x="178" y="76" width="64" height="24" rx="7" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <rect x="181" y="79" width="29" height="18" rx="5" fill="#27272a"/>
      <text x="195.5" y="91.5" font-size="10" font-weight="700" fill="#fafafa" text-anchor="middle">A</text>
      <text x="226" y="91.5" font-size="10" font-weight="600" fill="#52525b" text-anchor="middle">B</text>

      <!-- timer card: flat, hairline border, NO shadow, tighter radius -->
      <rect x="14" y="110" width="228" height="112" rx="14" fill="#101012" stroke="#27272a" stroke-width="1"/>
      <text x="28" y="134" font-size="8" font-weight="600" letter-spacing="1.5" fill="#71717a">A-TEIL LAUF</text>
      <text x="128" y="176" font-size="38" font-weight="600" letter-spacing="-1" fill="#fafafa" text-anchor="middle" font-family="ui-monospace, 'SF Mono', monospace">02:34,7</text>
